plugins { id 'com.android.application' }
android {
  namespace 'com.movtek.app'
  compileSdk 34
  defaultConfig {
    applicationId (project.findProperty('appId') ?: 'com.movtek.app')
    minSdk 23
    targetSdk 34
    versionCode 1
    versionName "1.0"
    resValue "string", "app_name", (project.findProperty('appName') ?: 'Movtek')
    resValue "string", "start_url", (project.findProperty('startUrl') ?: 'https://movtek.vercel.app')
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.debug }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
}
